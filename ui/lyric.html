<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌面歌词</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    .lyric-win {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 18px;
      border-radius: 10px;
      transition: background 0.2s;
      cursor: move;
    }
    .lyric-win:hover {
      background: rgba(15, 18, 26, 0.68);
    }
    .close-btn {
      position: absolute;
      top: 6px;
      right: 10px;
      opacity: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .lyric-win:hover .close-btn { opacity: 0.85; }
    .line-main {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .line-sub {
      margin-top: 4px;
      font-size: 15px;
      color: #bce3ff;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0,0,0,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="lyric-win" data-tauri-drag-region>
    <button class="close-btn" id="btn-close" title="关闭桌面歌词">✕</button>
    <div class="line-main" id="l-main" data-tauri-drag-region>TuneBox 桌面歌词</div>
    <div class="line-sub" id="l-sub" data-tauri-drag-region></div>
  </div>
  <script>
    const { event, window: tauriWindow } = window.__TAURI__;
    const mainEl = document.getElementById('l-main');
    const subEl = document.getElementById('l-sub');
    event.listen('lyric-update', (ev) => {
      const { line, tline } = ev.payload || {};
      mainEl.textContent = line || '♪';
      subEl.textContent = tline || '';
    });
    document.getElementById('btn-close').addEventListener('click', () => {
      tauriWindow.getCurrentWindow().hide();
    });
  </script>
</body>
</html>
